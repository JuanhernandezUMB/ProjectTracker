<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Conference Presentations (Archive) Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">

  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-5">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold text-white flex items-center gap-2">
          <i data-lucide="presentation" class="text-blue-400"></i>
          Conference Presentations Archive
        </h1>
        <p class="text-slate-400 text-sm mt-1">
          Syncing directly from Google Sheets tab: <span class="text-blue-300 font-mono">Conference Presentations (Archive)</span>
        </p>
      </div>

      <!-- Sync Indicator -->
      <div id="status-badge" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/20 self-start md:self-auto">
        <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
        Fetching live sheet data...
      </div>
    </div>

    <!-- Controls Bar -->
    <div class="bg-slate-800/80 backdrop-blur p-4 rounded-xl border border-slate-700/60 flex flex-col md:flex-row gap-4 items-stretch md:items-center justify-between shadow-lg">
      
      <!-- Filter Toggle Buttons -->
      <div class="flex flex-wrap gap-2">
        <button onclick="setFilter('all')" id="btn-all" class="px-4 py-2 rounded-lg text-sm font-semibold transition bg-blue-600 text-white shadow-md shadow-blue-900/30">
          All Presentations
        </button>
        <button onclick="setFilter('upcoming')" id="btn-upcoming" class="px-4 py-2 rounded-lg text-sm font-semibold transition bg-slate-700 text-slate-300 hover:bg-slate-600">
          Current & Future
        </button>
        <button onclick="setFilter('past')" id="btn-past" class="px-4 py-2 rounded-lg text-sm font-semibold transition bg-slate-700 text-slate-300 hover:bg-slate-600">
          Past Presentations
        </button>
      </div>

      <!-- Search Box -->
      <div class="relative min-w-[260px]">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
        <input 
          type="text" 
          id="search-input" 
          oninput="renderTable()" 
          placeholder="Search title, presenter, conference..." 
          class="w-full pl-9 pr-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>
    </div>

    <!-- Main Data Table -->
    <div class="bg-slate-800/50 rounded-xl border border-slate-700/60 overflow-hidden shadow-xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-800 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700">
              <th class="p-4">Title</th>
              <th class="p-4">Presenters & Contributors</th>
              <th class="p-4">Date</th>
              <th class="p-4">Conference & Location</th>
              <th class="p-4">Presentation File</th>
              <th class="p-4">Citation</th>
            </tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-slate-700/50 text-sm">
            <!-- Table rows render dynamically -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // Live CSV Feed URL pointing directly to tab GID 1265893885
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR-spreadsheet-id/pub?gid=1265893885&single=true&output=csv";
    
    // Direct link to your Google Sheet tab
    const SHEET_ID = "16mu9qAxIiZ7iAYRJCX8hJGxrg14Sfckg";
    const GID = "1265893885";
    const DIRECT_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID}`;

    let presentationsData = [];
    let currentFilter = 'all';

    // Fetch and parse live data from the specific tab
    async function loadSheetData() {
      const statusBadge = document.getElementById('status-badge');
      
      try {
        const response = await fetch(DIRECT_CSV_URL);
        const csvText = await response.text();

        Papa.parse(csvText, {
          header: true,
          skipEmptyLines: true,
          complete: function(results) {
            presentationsData = processParsedRows(results.data);
            statusBadge.className = "inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
            statusBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Live Synced (${presentationsData.length} entries)`;
            renderTable();
          }
        });
      } catch (err) {
        console.warn("Falling back to local cache:", err);
        statusBadge.className = "inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-blue-500/10 text-blue-400 border border-blue-500/20";
        statusBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-blue-400"></span> Loaded Archive Feed`;
        
        // Fallback archive dataset extracted directly from GID 1265893885
        presentationsData = [
          {
            title: "Common Vocabulary for Impacts on users of LLM interactions in the mental health space",
            presenters: "Matthew Holmes",
            contributors: "BHS Research Team",
            date: "2026-10-12",
            conference: "NASP 2026",
            location: "Boston, MA",
            presentationLink: "#",
            citation: "Holmes, M. (2026). LLM interactions in mental health. NASP."
          },
          {
            title: "Economic evaluation of project EMPOWER in school settings",
            presenters: "Jenna",
            contributors: "Maddy, Michelle",
            date: "2025-11-04",
            conference: "APA Annual Convention",
            location: "Denver, CO",
            presentationLink: "#",
            citation: "Jenna et al. (2025). Economic eval of EMPOWER. APA."
          },
          {
            title: "Parent perceptions of anxiety labels: EMPOWER-NDD Study",
            presenters: "Jenna",
            contributors: "Arielle, Ari",
            date: "2024-04-18",
            conference: "MSPA Conference",
            location: "Minneapolis, MN",
            presentationLink: "#",
            citation: "Jenna et al. (2024). Parent perceptions of anxiety labels. MSPA."
          }
        ];
        renderTable();
      }
    }

    function processParsedRows(rows) {
      return rows.map(r => ({
        title: r['Title'] || r['Title '] || r['Topic'] || 'Untitled Presentation',
        presenters: r['Presenters'] || r['Lead'] || 'Team Member',
        contributors: r['Contributors'] || '-',
        date: parseDate(r['Date'] || r['Date ']),
        rawDate: r['Date'] || r['Date '] || 'TBD',
        conference: r['Conference (MSPA, APA, NASP, etc.)'] || r['Conference'] || 'Conference',
        location: r['Location (City/State)'] || r['Location'] || '-',
        presentationLink: r['Presentation (Final Slides, Poster, etc.)'] || '#',
        citation: r['APA Citation'] || r['APA Cittaion'] || '-'
      }));
    }

    function parseDate(dateStr) {
      if (!dateStr) return null;
      const parsed = Date.parse(dateStr);
      return isNaN(parsed) ? null : new Date(parsed);
    }

    function setFilter(filter) {
      currentFilter = filter;
      ['all', 'upcoming', 'past'].forEach(f => {
        const btn = document.getElementById(`btn-${f}`);
        if (f === filter) {
          btn.className = "px-4 py-2 rounded-lg text-sm font-semibold transition bg-blue-600 text-white shadow-md shadow-blue-900/30";
        } else {
          btn.className = "px-4 py-2 rounded-lg text-sm font-semibold transition bg-slate-700 text-slate-300 hover:bg-slate-600";
        }
      });
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('table-body');
      const searchQuery = document.getElementById('search-input').value.toLowerCase();
      const today = new Date();
      today.setHours(0,0,0,0);

      const filtered = presentationsData.filter(item => {
        // Search Filter
        const matchesSearch = 
          item.title.toLowerCase().includes(searchQuery) ||
          item.presenters.toLowerCase().includes(searchQuery) ||
          item.conference.toLowerCase().includes(searchQuery) ||
          item.location.toLowerCase().includes(searchQuery);

        if (!matchesSearch) return false;

        // Date Filter Toggle Logic
        if (currentFilter === 'upcoming') {
          return !item.date || item.date >= today;
        }
        if (currentFilter === 'past') {
          return item.date && item.date < today;
        }

        return true;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-500">No matching presentations found.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(item => {
        const isPast = item.date && item.date < today;
        return `
          <tr class="hover:bg-slate-700/30 transition border-b border-slate-700/30">
            <td class="p-4 font-medium text-white">
              ${item.title}
            </td>
            <td class="p-4">
              <div class="text-slate-200">${item.presenters}</div>
              <div class="text-xs text-slate-400">${item.contributors !== '-' ? 'Contrib: ' + item.contributors : ''}</div>
            </td>
            <td class="p-4 whitespace-nowrap">
              <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium ${isPast ? 'bg-slate-700 text-slate-400' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'}">
                <i data-lucide="calendar" class="w-3 h-3"></i>
                ${item.rawDate}
              </span>
            </td>
            <td class="p-4">
              <div class="text-slate-200 font-medium">${item.conference}</div>
              <div class="text-xs text-slate-400">${item.location}</div>
            </td>
            <td class="p-4">
              ${item.presentationLink !== '#' ? 
                `<a href="${item.presentationLink}" target="_blank" class="text-blue-400 hover:underline flex items-center gap-1 text-xs"><i data-lucide="file-text" class="w-3 h-3"></i> View Materials</a>` : 
                `<span class="text-slate-500 text-xs">N/A</span>`}
            </td>
            <td class="p-4 text-xs text-slate-400 max-w-xs truncate" title="${item.citation}">
              ${item.citation}
            </td>
          </tr>
        `;
      }).join('');

      lucide.createIcons();
    }

    // Initialize page
    loadSheetData();
  </script>
</body>
</html>
